{% extends "layout/base_menu.html" %}

{% block titulo %}{{ titulo }} - SuperMotos{% endblock %}

{% block conteudo %}
<div class="container py-4">
  <h2 class="mb-4">{{ titulo }}</h2>

  <div class="card shadow-sm">
    <div class="card-body p-4">
      <form method="post" class="row g-3">

        <div class="col-md-6">
          <label for="cliente_id" class="form-label">Cliente</label>
          <select class="form-select" id="cliente_id" name="cliente_id" required>
            <option value="">Escolha...</option>
            {% for usuario in usuarios %}
            <option value="{{ usuario.id }}" {% if dados.cliente_id == usuario.id %}selected{% endif %}>{{ usuario.nome }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label for="produto_id" class="form-label">Moto</label>
          <select class="form-select" id="produto_id" name="produto_id" required>
            <option value="">Escolha...</option>
            {% for produto in produtos %}
            <option value="{{ produto.id }}" {% if dados.produto_id == produto.id %}selected{% endif %}>
              {{ produto.marca }} {{ produto.modelo }} - {{ produto.preco | real }}
            </option>
            {% endfor %}
          </select>
        </div>

        <div class="col-md-4">
          <label for="quantidade" class="form-label">Quantidade</label>
          <input type="number" min="1" class="form-control" id="quantidade" name="quantidade"
            value="{{ dados.quantidade or 1 }}" required>
        </div>
        <div class="col-md-4">
          <label for="pagamento" class="form-label">Forma de pagamento</label>
          <select class="form-select" id="pagamento" name="pagamento" required>
            <option value="">Escolha...</option>
            {% for pagamento in pagamentos %}
            <option value="{{ pagamento }}" {% if dados.pagamento == pagamento %}selected{% endif %}>{{ pagamento }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-4">
          <label for="data" class="form-label">Data da venda</label>
          <input type="date" class="form-control" id="data" name="data" value="{{ dados.data }}" required>
        </div>

        <div class="col-12 d-flex justify-content-between mt-4">
          <a href="{{ url_for('vendas_listar') }}" class="btn btn-link">Voltar</a>
          <div>
            <button type="reset" class="btn btn-outline-secondary">Limpar</button>
            <button type="submit" class="btn btn-primary">Salvar</button>
          </div>
        </div>

      </form>
    </div>
  </div>
</div>
{% endblock %}
