{% extends "layout/base_limpa.html" %}

{% block titulo %}Login - SuperMotos{% endblock %}

{% block conteudo %}
<div class="card cartao-login shadow">
    <div class="card-body p-4">
        <div class="text-center mb-3">
            <img src="{{ url_for('static', filename='imgs/logo.png') }}" alt="SuperMotos" height="66">
        </div>

        <h2 class="h4 text-center mb-4">Login</h2>

        <form>
            <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="Digite seu e-mail"
                    required autofocus>
            </div>

            <div class="mb-3">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" class="form-control" id="senha" name="senha" placeholder="Digite sua senha"
                    required>
            </div>

            <a href="{{ url_for('dashboard') }}" class="btn btn-primary w-100">Entrar</a>
        </form>

        <div class="text-center my-3">
            <a href="#">Recuperar senha</a>
        </div>

        <a href="{{ url_for('inserir_usuario') }}" class="btn btn-outline-primary w-100">Cadastrar</a>
    </div>
</div>
{% endblock %}
