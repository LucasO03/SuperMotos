{% extends "base.html" %}

{% block titulo %}{{ titulo }} - SuperMotos{% endblock %}

{% block conteudo %}
<div class="conteudo">
  <h2 class="mt-5 mb-2">{{ titulo }}</h2>

  <div class="card">
    <div class="card-body p-3">
      <form method="post">

        <div class="form-row">
          <div class="form-group col-md-6">
            <label for="modelo">Modelo:</label>
            <input type="text" class="form-control" id="modelo" name="modelo" value="{{ dados.modelo }}" required>
          </div>
          <div class="form-group col-md-6">
            <label for="marca">Marca:</label>
            <input type="text" class="form-control" id="marca" name="marca" value="{{ dados.marca }}" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group col-md-3">
            <label for="categoria">Categoria:</label>
            <select class="custom-select" id="categoria" name="categoria" required>
              <option value="">-- ESCOLHA --</option>
              {% for categoria in categorias %}
              <option value="{{ categoria }}" {% if dados.categoria==c %}selected{% endif %}>{{ categoria }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="form-group col-md-3">
            <label for="cilindrada">Cilindrada (cc):</label>
            <input type="number" min="0" class="form-control" id="cilindrada" name="cilindrada"
              value="{{ dados.cilindrada }}">
          </div>
          <div class="form-group col-md-3">
            <label for="ano">Ano:</label>
            <input type="number" min="1900" class="form-control" id="ano" name="ano" value="{{ dados.ano }}">
          </div>
          <div class="form-group col-md-3">
            <label for="cor">Cor:</label>
            <input type="text" class="form-control" id="cor" name="cor" value="{{ dados.cor }}">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group col-md-6">
            <label for="preco">Preço (R$):</label>
            <input type="number" min="0" step="0.01" class="form-control" id="preco" name="preco"
              value="{{ dados.preco }}" required>
          </div>
          <div class="form-group col-md-6">
            <label for="estoque">Estoque:</label>
            <input type="number" min="0" class="form-control" id="estoque" name="estoque" value="{{ dados.estoque }}"
              required>
          </div>
        </div>

        <div class="form-row">
          <div class="col-4">
            <a href="{{ url_for('produtos_listar') }}" class="btn btn-link">Voltar</a>
          </div>
          <div class="col-4 text-center">
            <button type="reset" class="btn btn-secondary">Limpar</button>
          </div>
          <div class="col-4 text-right">
            <button type="submit" class="btn btn-success">Salvar</button>
          </div>
        </div>

      </form>
    </div>
  </div>
</div>
{% endblock %}
