{% extends "base.html" %}

{% block titulo %}{{ titulo }} - SuperMotos{% endblock %}

{% block conteudo %}
<div class="conteudo">
  <h2 class="mt-5 mb-2">{{ titulo }}</h2>

  <div class="card">
    <div class="card-body p-3">
      <form method="post">

        <div class="form-row">
          <div class="form-group col-md-6">
            <label for="nome">Nome:</label>
            <input type="text" class="form-control" id="nome" name="nome" value="{{ dados.nome }}" required>
          </div>
          <div class="form-group col-md-6">
            <label for="email">Email:</label>
            <input type="email" class="form-control" id="email" name="email" value="{{ dados.email }}" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group col-md-3">
            <label for="celular">Celular:</label>
            <input type="text" class="form-control" id="celular" name="celular" value="{{ dados.celular }}">
          </div>
          <div class="form-group col-md-3">
            <label for="nascimento">Data de Nascimento:</label>
            <input type="date" class="form-control" id="nascimento" name="nascimento" value="{{ dados.nascimento }}">
          </div>
          <div class="form-group col-md-3">
            <label for="cpf">CPF:</label>
            <input type="text" class="form-control" id="cpf" name="cpf" value="{{ dados.cpf }}">
          </div>
          <div class="form-group col-md-3">
            <label for="nivel" class="text-primary font-weight-bold">Nível de Acesso:</label>
            <select class="custom-select" id="nivel" name="nivel" required>
              <option value="">-- ESCOLHA --</option>
              {% for nivel in niveis %}
              <option value="{{ nivel }}" {% if dados.nivel==n %}selected{% endif %}>{{ nivel }}</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group col-md-3">
            <label for="cep">CEP:</label>
            <input type="text" class="form-control" id="cep" name="cep" value="{{ dados.cep }}">
          </div>
          <div class="form-group col-md-7">
            <label for="endereco">Endereço:</label>
            <input type="text" class="form-control" id="endereco" name="endereco" value="{{ dados.endereco }}">
          </div>
          <div class="form-group col-md-2">
            <label for="numero">Número:</label>
            <input type="text" class="form-control" id="numero" name="numero" value="{{ dados.numero }}">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group col-md-4">
            <label for="complemento">Complemento:</label>
            <input type="text" class="form-control" id="complemento" name="complemento" value="{{ dados.complemento }}">
          </div>
          <div class="form-group col-md-4">
            <label for="cidade">Cidade:</label>
            <input type="text" class="form-control" id="cidade" name="cidade" value="{{ dados.cidade }}">
          </div>
          <div class="form-group col-md-4">
            <label for="estado">Estado:</label>
            <select class="custom-select" id="estado" name="estado">
              <option value="">-- ESCOLHA --</option>
              {% for uf in estados %}
              <option value="{{ uf }}" {% if dados.estado==uf %}selected{% endif %}>{{ uf }}</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="col-4">
            <a href="{{ url_for('usuarios_listar') }}" class="btn btn-link">Voltar</a>
          </div>
          <div class="col-4 text-center">
            <button type="reset" class="btn btn-secondary">Limpar</button>
          </div>
          <div class="col-4 text-right">
            <button type="submit" class="btn btn-success">Salvar</button>
          </div>
        </div>

      </form>
    </div>
  </div>
</div>
{% endblock %}
