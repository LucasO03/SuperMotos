{% extends "base.html" %}

{% block titulo %}{{ titulo }} - SuperMotos{% endblock %}

{% block conteudo %}
<div class="conteudo">
  <h2 class="mt-5 mb-2">{{ titulo }}</h2>

  <div class="card">
    <div class="card-body p-3">
      <form method="post">

        <div class="form-row">
          <div class="form-group col-md-6">
            <label for="cliente_id">Cliente:</label>
            <select class="custom-select" id="cliente_id" name="cliente_id" required>
              <option value="">-- ESCOLHA --</option>
              {% for usuario in usuarios %}
              <option value="{{ usuario.id }}" {% if dados.cliente_id==usuario.id %}selected{% endif %}>{{ usuario.nome
                }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="form-group col-md-6">
            <label for="produto_id">Moto:</label>
            <select class="custom-select" id="produto_id" name="produto_id" required>
              <option value="">-- ESCOLHA --</option>
              {% for produto in produtos %}
              <option value="{{ produto.id }}" {% if dados.produto_id==produto.id %}selected{% endif %}>
                {{ produto.marca }} {{ produto.modelo }} - {{ produto.preco | real }}
              </option>
              {% endfor %}
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group col-md-4">
            <label for="quantidade">Quantidade:</label>
            <input type="number" min="1" class="form-control" id="quantidade" name="quantidade"
              value="{{ dados.quantidade or 1 }}" required>
          </div>
          <div class="form-group col-md-4">
            <label for="pagamento">Forma de Pagamento:</label>
            <select class="custom-select" id="pagamento" name="pagamento" required>
              <option value="">-- ESCOLHA --</option>
              {% for pagamento in pagamentos %}
              <option value="{{ pagamento }}" {% if dados.pagamento==f %}selected{% endif %}>{{ pagamento }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="form-group col-md-4">
            <label for="data">Data da Venda:</label>
            <input type="date" class="form-control" id="data" name="data" value="{{ dados.data }}" required>
          </div>
        </div>

        <div class="form-row">
          <div class="col-4">
            <a href="{{ url_for('vendas_listar') }}" class="btn btn-link">Voltar</a>
          </div>
          <div class="col-4 text-center">
            <button type="reset" class="btn btn-secondary">Limpar</button>
          </div>
          <div class="col-4 text-right">
            <button type="submit" class="btn btn-success">Salvar</button>
          </div>
        </div>

      </form>
    </div>
  </div>
</div>
{% endblock %}
