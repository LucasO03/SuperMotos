{% extends "layout/base_menu.html" %}

{% block titulo %}Listagem de Usuários - SuperMotos{% endblock %}

{% block conteudo %}
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0">Listagem de Usuários</h2>
    <a href="{{ url_for('inserir_usuario') }}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Adicionar</a>
  </div>

  <div class="card shadow-sm">
    <div class="card-body p-3">
      <input type="search" class="form-control mb-3" placeholder="Buscar usuário...">

      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>E-mail</th>
              <th>Celular</th>
              <th>Perfil</th>
              <th class="text-end">Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>1</td>
              <td>Nome do Usuário</td>
              <td>usuario@email.com</td>
              <td>(14) 99999-0000</td>
              <td><span class="badge text-bg-primary">Administrador</span></td>
              <td class="text-end text-nowrap">
                <button type="button" class="btn btn-outline-primary btn-sm"><i class="bi bi-pencil"></i> Editar</button>
                <button type="button" class="btn btn-outline-danger btn-sm"><i class="bi bi-trash"></i> Excluir</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
{% endblock %}
