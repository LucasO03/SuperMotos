{% extends "layout/base_menu.html" %}

{% block titulo %}{{ titulo }} - SuperMotos{% endblock %}

{% block conteudo %}
<div class="container py-4">
  <h2 class="mb-4">{{ titulo }}</h2>

  <div class="card shadow-sm">
    <div class="card-body p-4">
      <form method="post" class="row g-3">

        <h5 class="col-12 mb-0">Dados pessoais</h5>

        <div class="col-md-6">
          <label for="nome" class="form-label">Nome</label>
          <input type="text" class="form-control" id="nome" name="nome" value="{{ dados.nome }}" required>
        </div>
        <div class="col-md-6">
          <label for="email" class="form-label">E-mail</label>
          <input type="email" class="form-control" id="email" name="email" value="{{ dados.email }}" required>
        </div>

        <div class="col-md-3">
          <label for="celular" class="form-label">Celular</label>
          <input type="text" class="form-control" id="celular" name="celular" value="{{ dados.celular }}">
        </div>
        <div class="col-md-3">
          <label for="nascimento" class="form-label">Data de nascimento</label>
          <input type="date" class="form-control" id="nascimento" name="nascimento" value="{{ dados.nascimento }}">
        </div>
        <div class="col-md-3">
          <label for="cpf" class="form-label">CPF</label>
          <input type="text" class="form-control" id="cpf" name="cpf" value="{{ dados.cpf }}">
        </div>
        <div class="col-md-3">
          <label for="nivel" class="form-label">Nível de acesso</label>
          <select class="form-select" id="nivel" name="nivel" required>
            <option value="">Escolha...</option>
            {% for nivel in niveis %}
            <option value="{{ nivel }}" {% if dados.nivel == nivel %}selected{% endif %}>{{ nivel }}</option>
            {% endfor %}
          </select>
        </div>

        <h5 class="col-12 mt-4 mb-0">Endereço</h5>

        <div class="col-md-3">
          <label for="cep" class="form-label">CEP</label>
          <input type="text" class="form-control" id="cep" name="cep" value="{{ dados.cep }}">
        </div>
        <div class="col-md-7">
          <label for="endereco" class="form-label">Endereço</label>
          <input type="text" class="form-control" id="endereco" name="endereco" value="{{ dados.endereco }}">
        </div>
        <div class="col-md-2">
          <label for="numero" class="form-label">Número</label>
          <input type="text" class="form-control" id="numero" name="numero" value="{{ dados.numero }}">
        </div>

        <div class="col-md-4">
          <label for="complemento" class="form-label">Complemento</label>
          <input type="text" class="form-control" id="complemento" name="complemento" value="{{ dados.complemento }}">
        </div>
        <div class="col-md-4">
          <label for="cidade" class="form-label">Cidade</label>
          <input type="text" class="form-control" id="cidade" name="cidade" value="{{ dados.cidade }}">
        </div>
        <div class="col-md-4">
          <label for="estado" class="form-label">Estado</label>
          <select class="form-select" id="estado" name="estado">
            <option value="">Escolha...</option>
            {% for uf in estados %}
            <option value="{{ uf }}" {% if dados.estado == uf %}selected{% endif %}>{{ uf }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="col-12 d-flex justify-content-between mt-4">
          <a href="{{ url_for('usuarios_listar') }}" class="btn btn-link">Voltar</a>
          <div>
            <button type="reset" class="btn btn-outline-secondary">Limpar</button>
            <button type="submit" class="btn btn-primary">Salvar</button>
          </div>
        </div>

      </form>
    </div>
  </div>
</div>
{% endblock %}
