{% extends "layout/base_menu.html" %}

{% block titulo %}Cadastro de Usuário - SuperMotos{% endblock %}

{% block conteudo %}
<div class="container py-4">
  <h2 class="mb-4">Cadastro de Usuário</h2>

  <div class="card shadow-sm">
    <div class="card-body p-4">
      <form class="row g-3">

        <h5 class="col-12 mb-0">Dados pessoais</h5>

        <div class="col-md-6">
          <label for="nome" class="form-label">Nome</label>
          <input type="text" class="form-control" id="nome" name="nome" required>
        </div>
        <div class="col-md-6">
          <label for="email" class="form-label">E-mail</label>
          <input type="email" class="form-control" id="email" name="email" required>
        </div>

        <div class="col-md-4">
          <label for="celular" class="form-label">Celular</label>
          <input type="text" class="form-control" id="celular" name="celular">
        </div>
        <div class="col-md-4">
          <label for="nascimento" class="form-label">Data de nascimento</label>
          <input type="date" class="form-control" id="nascimento" name="nascimento">
        </div>
        <div class="col-md-4">
          <label for="cpf" class="form-label">CPF</label>
          <input type="text" class="form-control" id="cpf" name="cpf">
        </div>

        <div class="col-md-6">
          <label for="id_perfil" class="form-label">Perfil</label>
          <select class="form-select" id="id_perfil" name="id_perfil" required>
            <option value="">Escolha...</option>
            <option value="1">Usuário</option>
            <option value="2">Administrador</option>
          </select>
        </div>
        <div class="col-md-6">
          <label for="senha" class="form-label">Senha</label>
          <input type="password" class="form-control" id="senha" name="senha" required>
        </div>

        <h5 class="col-12 mt-4 mb-0">Endereço</h5>

        <div class="col-md-3">
          <label for="cep" class="form-label">CEP</label>
          <input type="text" class="form-control" id="cep" name="cep">
        </div>
        <div class="col-md-7">
          <label for="endereco" class="form-label">Endereço</label>
          <input type="text" class="form-control" id="endereco" name="endereco">
        </div>
        <div class="col-md-2">
          <label for="numero" class="form-label">Número</label>
          <input type="text" class="form-control" id="numero" name="numero">
        </div>

        <div class="col-md-4">
          <label for="complemento" class="form-label">Complemento</label>
          <input type="text" class="form-control" id="complemento" name="complemento">
        </div>
        <div class="col-md-4">
          <label for="cidade" class="form-label">Cidade</label>
          <input type="text" class="form-control" id="cidade" name="cidade">
        </div>
        <div class="col-md-4">
          <label for="estado" class="form-label">Estado</label>
          <select class="form-select" id="estado" name="estado">
            <option value="">Escolha...</option>
            {% for uf in ["AC", "AL", "AP", "AM", "BA", "CE", "DF", "ES", "GO", "MA", "MT", "MS", "MG", "PA", "PB", "PR", "PE", "PI", "RJ", "RN", "RS", "RO", "RR", "SC", "SP", "SE", "TO"] %}
            <option value="{{ uf }}">{{ uf }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="col-12 d-flex justify-content-between mt-4">
          <a href="{{ url_for('listar_usuarios') }}" class="btn btn-link">Voltar</a>
          <div>
            <button type="reset" class="btn btn-outline-secondary">Limpar</button>
            <button type="button" class="btn btn-primary">Salvar</button>
          </div>
        </div>

      </form>
    </div>
  </div>
</div>
{% endblock %}
