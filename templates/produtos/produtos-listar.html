{% extends "layout/base_menu.html" %}

{% block titulo %}Listagem de Produtos - SuperMotos{% endblock %}

{% block conteudo %}
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0">Listagem de Produtos</h2>
    <a href="{{ url_for('inserir_produto') }}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Adicionar</a>
  </div>

  <div class="card shadow-sm">
    <div class="card-body p-3">
      <input type="search" class="form-control mb-3" placeholder="Buscar moto...">

      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Modelo</th>
              <th>Marca</th>
              <th>Categoria</th>
              <th>Cilindrada</th>
              <th>Cor</th>
              <th class="text-end">Preço</th>
              <th class="text-center">Estoque</th>
              <th class="text-end">Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>1</td>
              <td>CG 160 Start</td>
              <td>Honda</td>
              <td>Street</td>
              <td>160 cc</td>
              <td>Vermelha</td>
              <td class="text-end">R$ 17.900,00</td>
              <td class="text-center"><span class="badge text-bg-success">5</span></td>
              <td class="text-end text-nowrap">
                <button type="button" class="btn btn-outline-primary btn-sm"><i class="bi bi-pencil"></i> Editar</button>
                <button type="button" class="btn btn-outline-danger btn-sm"><i class="bi bi-trash"></i> Excluir</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
{% endblock %}
