{% extends "layout/base_menu.html" %}

{% block titulo %}{{ titulo }} - SuperMotos{% endblock %}

{% block conteudo %}
<div class="container py-4">
  <h2 class="mb-4">{{ titulo }}</h2>

  <div class="card shadow-sm">
    <div class="card-body p-4">
      <form method="post" class="row g-3">

        <div class="col-md-6">
          <label for="modelo" class="form-label">Modelo</label>
          <input type="text" class="form-control" id="modelo" name="modelo" value="{{ dados.modelo }}" required>
        </div>
        <div class="col-md-6">
          <label for="marca" class="form-label">Marca</label>
          <input type="text" class="form-control" id="marca" name="marca" value="{{ dados.marca }}" required>
        </div>

        <div class="col-md-3">
          <label for="categoria" class="form-label">Categoria</label>
          <select class="form-select" id="categoria" name="categoria" required>
            <option value="">Escolha...</option>
            {% for categoria in categorias %}
            <option value="{{ categoria }}" {% if dados.categoria == categoria %}selected{% endif %}>{{ categoria }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-3">
          <label for="cilindrada" class="form-label">Cilindrada (cc)</label>
          <input type="number" min="0" class="form-control" id="cilindrada" name="cilindrada" value="{{ dados.cilindrada }}">
        </div>
        <div class="col-md-3">
          <label for="ano" class="form-label">Ano</label>
          <input type="number" min="1900" class="form-control" id="ano" name="ano" value="{{ dados.ano }}">
        </div>
        <div class="col-md-3">
          <label for="cor" class="form-label">Cor</label>
          <input type="text" class="form-control" id="cor" name="cor" value="{{ dados.cor }}">
        </div>

        <div class="col-md-6">
          <label for="preco" class="form-label">Preço (R$)</label>
          <input type="number" min="0" step="0.01" class="form-control" id="preco" name="preco"
            value="{{ dados.preco }}" required>
        </div>
        <div class="col-md-6">
          <label for="estoque" class="form-label">Estoque</label>
          <input type="number" min="0" class="form-control" id="estoque" name="estoque" value="{{ dados.estoque }}" required>
        </div>

        <div class="col-12 d-flex justify-content-between mt-4">
          <a href="{{ url_for('produtos_listar') }}" class="btn btn-link">Voltar</a>
          <div>
            <button type="reset" class="btn btn-outline-secondary">Limpar</button>
            <button type="submit" class="btn btn-primary">Salvar</button>
          </div>
        </div>

      </form>
    </div>
  </div>
</div>
{% endblock %}
